<!DOCTYPE html> 
<html lang="en">
<head></head>
<body>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haiku </title>
<style>
body {
            font-family: Georgia, "Times New Roman", serif;
            background-color: #f4f1e8;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 60px 20px;
        }
.haiku-container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 50px;
            border: 1px solid #ccc;
        }
h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
h2 {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 40px;
            color: #666;
        }
.haiku {
            font-size: 24px;
            line-height: 2;
            margin-bottom: 35px;
        }
.author {
            font-size: 18px;
            font-style: italic;
        }
img {
            width: 700px;
            margin-top: 90px;
        }
    </style>
<div class="haiku-container">
<h1>The Old Pond</h1>
<h2>A Haiku by Matsuo Basho</h2>
<div class="haiku">
An old silent pond<br>
A frog jumps into the pond—<br>
Splash! Silence again.
</div>
<div class="author">
 — Matsuo Basho
</div>
<img src="Haiku.img/Frogpng.png" alt="Frogpng.png">
</div>
